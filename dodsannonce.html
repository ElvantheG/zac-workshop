<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dødsannonce – Poul Erik Christensen</title>
  <style>
    body {
      background: #e8e0d4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    .notice {
      background: #fff;
      border: 2px solid #222;
      width: 380px;
      padding: 32px 36px 28px 36px;
      position: relative;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
    }

    .heart {
      font-size: 28px;
      color: #222;
      display: block;
      margin-bottom: 14px;
      line-height: 1;
    }

    .intro {
      font-size: 14px;
      color: #222;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      color: #111;
      margin: 6px 0 10px 0;
      line-height: 1.3;
    }

    .dates {
      font-size: 13.5px;
      color: #222;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    .personal {
      font-size: 13.5px;
      color: #222;
      line-height: 1.7;
      margin-bottom: 16px;
      font-style: italic;
    }

    .family {
      font-size: 13.5px;
      color: #222;
      font-style: italic;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .funeral {
      font-size: 13px;
      color: #222;
      line-height: 1.6;
      border-top: 1px solid #aaa;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="notice">
    <span class="heart">♡</span>

    <div class="intro">Vores kære</div>

    <div class="name">Poul Erik Christensen</div>

    <div class="dates">✶ 15. januar 1946 &nbsp;&nbsp;&nbsp; † 19. juni 2026</div>

    <div class="personal">
      Altid klar med en kæk bemærkning –<br>
      du vil blive savnet og husket af mange.<br><br>
      Tak for alt, hvad du var for os.
    </div>

    <div class="family">Elvan og Pia</div>

    <div class="funeral">
      Bisættelse finder sted torsdag den 25. juni kl. 13.00<br>
      i Mariager Kirke.
    </div>
  </div>
</body>
</html>
